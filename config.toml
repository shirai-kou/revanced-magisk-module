author = "shirai-kou"
author-page = "github.com/shirai-kou"
enable-magisk-update = true # set this to false if you do not want to receive updates for the module in magisk app
parallel-jobs = 1
patches-version = "dev"
cli-version = "dev"
dpi = "nodpi anydpi 120-640dpi"

# add 'enabled = false' for not patching a specific app or remove it from the config
# see https://github.com/j-hc/revanced-magisk-module/blob/main/CONFIG.md for more detailed explanations

# you can use rvmm-config-gen to generate a config

[Music]
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube-music"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
arch = "arm64-v8a"
build-mode = "module"

[Reddit]
apkmirror-dlurl = "https://apkmirror.com/apk/redditinc/reddit"
uptodown-dlurl = "https://reddit-official-app.en.uptodown.com/android"
excluded-patches = "'Sanitize sharing links' 'Disable screenshot popup'" # patches are failing to apply
arch = "arm64-v8a"
build-mode = "module"

[Strava]
apkmirror-dlurl = "https://www.apkmirror.com/apk/strava-inc/strava-run-hike-bike/" # the application was removed because of a DMCA takedown by Strava Inc.
uptodown-dlurl = "https://strava.en.uptodown.com/android"
arch = "arm64-v8a"
build-mode = "module"

[Facebook]
apkmirror-dlurl = "https://apkmirror.com/apk/facebook-2/facebook"
uptodown-dlurl = "https://facebook.en.uptodown.com/android"
excluded-patches = "'Hide story ads' 'Hide ''Sponsored Stories'''" # patches are failing to apply
arch = "arm64-v8a"
build-mode = "module"

[Messenger]
apkmirror-dlurl = "https://apkmirror.com/apk/facebook-2/messenger"
uptodown-dlurl = "https://facebook-messenger.en.uptodown.com/android"
arch = "arm64-v8a"
build-mode = "module"

[Spotify]
apkmirror-dlurl = "https://apkmirror.com/apk/spotify-ab/spotify-music-podcasts"
uptodown-dlurl = "https://spotify.en.uptodown.com/android"
excluded-patches = "'Sanitize sharing links' 'BytecodePatch'" # patches are failing to apply
arch = "arm64-v8a"
build-mode = "module"

[Duolingo]
enabled = false # the application doesn't build yet
apkmirror-dlurl = "https://apkmirror.com/apk/duolingo/duolingo-duolingo"
uptodown-dlurl = "https://duolingo.en.uptodown.com/android"
arch = "arm64-v8a"
build-mode = "module"

[Instagram]
apkmirror-dlurl = "https://apkmirror.com/apk/instagram/instagram-instagram"
uptodown-dlurl = "https://instagram.en.uptodown.com/android"
excluded-patches = "'Hide navigation buttons'"
arch = "arm64-v8a"
build-mode = "module"

[Twitch]
apkmirror-dlurl = "https://apkmirror.com/apk/twitch-interactive-inc/twitch"
uptodown-dlurl = "https://twitch.en.uptodown.com/android"
arch = "arm64-v8a"
build-mode = "module"

[Twitter]
apkmirror-dlurl = "https://apkmirror.com/apk/x-corp/twitter"
uptodown-dlurl = "https://twitter.en.uptodown.com/android"
excluded-patches = "'Unlock downloads'"
arch = "arm64-v8a"
build-mode = "module"

[TikTok]
apkmirror-dlurl = "https://apkmirror.com/apk/tiktok-pte-ltd/tik-tok"
uptodown-dlurl = "https://tiktok.en.uptodown.com/android"
included-patches = "'SIM spoof'"
arch = "arm64-v8a"
build-mode = "module"

[YouTube]
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
arch = "arm64-v8a"
build-mode = "module"
